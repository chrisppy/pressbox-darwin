<!-- The app icon, flattened: for previews and anywhere outside the app.
     The app itself uses Pressbox/AppIcon.icon, made of these same shapes
     as layers (1-plate.svg, 2-headlines.svg) over a solid fill, so the
     system can render it in Liquid Glass and in its dark, clear and tinted
     looks. Change both together.
     pressbox: a filled home plate (in true proportions: square-cornered top
     half, 45° edges to the point) holding the day's headlines, which taper
     with it. Birdland colors: cream plate, Orioles oranges, black field.
     Square and full-bleed, since iOS and macOS round the corners. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">pressbox</title>
  <rect width="1024" height="1024" fill="#0b0b0b"/>
  <path d="M212 212 H812 V516 L512 816 L212 516 Z" fill="#e5dfd2" stroke="#e5dfd2" stroke-width="40" stroke-linejoin="round"/>
  <g fill="none" stroke-linecap="round" stroke-width="56">
    <path d="M352 392 H672" stroke="#ff7a1a"/>
    <path d="M392 500 H632" stroke="#ff7a1a"/>
    <path d="M448 608 H576" stroke="#df4601"/>
  </g>
</svg>
