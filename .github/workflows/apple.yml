name: Apple

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        destination: [
          "generic/platform=iOS Simulator",
          "generic/platform=macOS",
        ]
    name: build (${{ matrix.destination }})
    # macOS 26 ships Xcode 26: the iOS and macOS 26 SDKs are needed for
    # Liquid Glass.
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project Pressbox.xcodeproj \
            -scheme Pressbox \
            -destination '${{ matrix.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          ! grep -q ': warning: ' build.log || echo "::warning::the build has compiler warnings; see the log"
