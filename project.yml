# XcodeGen spec: run `xcodegen` in this directory to create Pressbox.xcodeproj.
name: Pressbox
options:
  bundleIdPrefix: org.red-oxide
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Calendar versions, YYYY.M.PATCH (see CHANGELOG.md). The build number is
    # the same as digits, YYYYMMPP, so it always increases.
    MARKETING_VERSION: "2026.11.0"
    CURRENT_PROJECT_VERSION: "20261100"
    # Set your team here or in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: "NNK6LS7D28"
targets:
  Pressbox:
    type: application
    # One target for iPhone, iPad and Mac: SwiftUI throughout, with
    # `#if os(macOS)` where the platforms differ.
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Pressbox
    # A shared scheme, so `xcodebuild -scheme Pressbox` works in CI.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.red-oxide.pressbox
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        # Assets.xcassets/AppIcon.appiconset, rendered from assets/app-icon.svg.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Assets.xcassets/AccentColor.colorset: Orioles orange, from Birdland.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: pressbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        # iPhone and iPad only.
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": true
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Mac only: the App Sandbox (with outgoing connections, for the
        # server) and the hardened runtime.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": true
    info:
      path: Pressbox/Info.plist
      properties:
        # Plain http is allowed only to local addresses (LAN IPs, .local
        # names). Use https for anything else, e.g. `tailscale serve`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: pressbox connects to your feed server on the local network.
        NSFaceIDUsageDescription: pressbox can require Face ID to open your feeds.
        # Background refresh keeps the unread badge current (iOS; the Mac
        # app refreshes on a timer while it is open). Audio keeps podcasts
        # playing (and video in picture in picture) in the background.
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [org.red-oxide.pressbox.refresh]
        # Only standard HTTPS, which is exempt from export compliance, so
        # TestFlight doesn't ask about encryption on every build.
        ITSAppUsesNonExemptEncryption: false
