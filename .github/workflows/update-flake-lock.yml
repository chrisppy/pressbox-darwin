name: Update flake inputs

on:
  schedule:
    # Every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-flake-lock:
    uses: chrisppy/github-workflows/.github/workflows/update-flake-lock.yml@master
    permissions:
      contents: write
