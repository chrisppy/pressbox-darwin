# XcodeGen spec: run `xcodegen` in this directory to create Pressbox.xcodeproj.
name: Pressbox
options:
  bundleIdPrefix: org.red-oxide
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Swift 6's data-race checks, as warnings while the language mode is
    # still 5: once a build has none, SWIFT_VERSION can go to 6 and they
    # become errors.
    SWIFT_STRICT_CONCURRENCY: complete
    # Calendar versions, YY.MINOR.PATCH (see CHANGELOG.md). The build number
    # is the same as digits, MINOR and PATCH three each (26.1.2 is 26001002),
    # so it always increases, and is above the old YYYYMMPP build numbers.
    MARKETING_VERSION: "26.0.0"
    CURRENT_PROJECT_VERSION: "26000000"
    # Set your team here or in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: "NNK6LS7D28"
targets:
  Pressbox:
    type: application
    # One target for iPhone, iPad and Mac: SwiftUI throughout, with
    # `#if os(macOS)` where the platforms differ.
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Pressbox
      # The logic that also builds as a Swift package (Package.swift), so
      # its tests run on Linux.
      - Core
      # Also in the widget extension: what the widgets show, and their
      # play/pause intent.
      - Shared
    dependencies:
      - target: PressboxWidgets
    # A shared scheme, so `xcodebuild -scheme Pressbox` works in CI, and
    # `xcodebuild test` runs the unit tests.
    scheme:
      testTargets:
        - PressboxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.red-oxide.pressbox
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        # Pressbox/AppIcon.icon, the layered Icon Composer icon (XcodeGen
        # 2.45.1 or later adds it as a resource).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Assets.xcassets/AccentColor.colorset: Orioles orange, from Birdland.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: pressbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        # iPhone and iPad only.
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": true
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # The App Group shared with the widgets; on Mac also the App Sandbox
        # (with outgoing connections, for the server) and the hardened
        # runtime.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Config/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": true
    info:
      path: Pressbox/Info.plist
      properties:
        # Plain http is allowed only to local addresses (LAN IPs, .local
        # names). Use https for anything else, e.g. `tailscale serve`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: pressbox connects to your feed server on the local network.
        NSFaceIDUsageDescription: pressbox can require Face ID to open your feeds.
        # Background refresh keeps the unread badge current (iOS; the Mac
        # app refreshes on a timer while it is open). Audio keeps podcasts
        # playing (and video in picture in picture) in the background.
        UIBackgroundModes: [fetch, audio]
        # pressbox://item/123: the widgets open items.
        CFBundleURLTypes:
          - CFBundleURLName: org.red-oxide.pressbox
            CFBundleURLSchemes: [pressbox]
        BGTaskSchedulerPermittedIdentifiers: [org.red-oxide.pressbox.refresh]
        # Only standard HTTPS, which is exempt from export compliance, so
        # TestFlight doesn't ask about encryption on every build.
        ITSAppUsesNonExemptEncryption: false
  PressboxWidgets:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Widgets
      - Shared
      # The Birdland color sets.
      - path: Pressbox/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.red-oxide.pressbox.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: pressbox
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The App Group, to read what the app writes; on Mac also the App
        # Sandbox, which widget extensions need.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Config/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Widgets-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": true
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PressboxTests:
    type: bundle.unit-test
    platform: auto
    # Run in the iOS simulator; the app's logic is the same on Mac.
    supportedDestinations: [iOS]
    sources:
      - PressboxTests
    dependencies:
      - target: Pressbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.red-oxide.pressbox.tests
        GENERATE_INFOPLIST_FILE: true
