name: Apple

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        destination: [
          "generic/platform=iOS Simulator",
          "generic/platform=macOS",
        ]
    name: build (${{ matrix.destination }})
    # GitHub's macOS images are named for their Xcode: the app needs Xcode 27
    # and the iOS and macOS 27 SDKs.
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project Pressbox.xcodeproj \
            -scheme Pressbox \
            -destination '${{ matrix.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          ! grep -q ': warning: ' build.log || echo "::warning::the build has compiler warnings; see the log"

  # Core/'s tests with SwiftPM: a minute, where the simulator takes several,
  # and a check that Core/ stays free of Apple-only frameworks.
  test-linux:
    name: test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the unit tests
        run: swift test

  test:
    name: test (iOS Simulator)
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Run the unit tests
        run: |
          # Whichever iPhone simulator the runner has.
          simulator=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $simulator"
          xcodebuild test \
            -project Pressbox.xcodeproj \
            -scheme Pressbox \
            -destination "id=$simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
